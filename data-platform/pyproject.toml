[project]
name = "dp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyspark==4.0.1",
  "pyiceberg[sql-postgres,s3fs,pyarrow]==0.10.0",
  "pyarrow>=19",
  "psycopg[binary]>=3.2",
  "trino>=0.333",
]

[project.scripts]
dp = "dp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the compose stack and downloaded data"]

[tool.ruff]
line-length = 110
